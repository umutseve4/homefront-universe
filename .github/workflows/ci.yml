name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x', '24.x']
    steps:
      - name: Check out the exact revision under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Assert exact revision and report toolchain
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "verified_sha=$EXPECTED_SHA"
          node --version

      - name: Assert zero package dependencies
        run: |
          node -e "
            const p = require('./package.json');
            const d = Object.keys(p.dependencies || {}).length;
            const v = Object.keys(p.devDependencies || {}).length;
            if (d || v) { console.error('unexpected dependencies:', d, v); process.exit(1); }
            console.log('dependencies: 0 runtime, 0 dev');
          "

      - name: Static validation
        run: npm run validate

      - name: Unit tests
        run: npm test

      - name: Build single-file bundle
        run: npm run bundle

      - name: Verify emitted bundle
        run: npm run checkbundle

      - name: Assert run-to-run determinism
        run: |
          A=$(node tools/headless.mjs 1337 3 3000 | grep -o 'checksum=[0-9]*')
          B=$(node tools/headless.mjs 1337 3 3000 | grep -o 'checksum=[0-9]*')
          echo "run A: $A"
          echo "run B: $B"
          if [ "$A" != "$B" ]; then echo "non-deterministic across runs"; exit 1; fi
          echo "determinism holds on $(node --version)"

      - name: Compare against recorded baseline
        continue-on-error: ${{ matrix.node != '24.x' }}
        run: |
          C=$(node tools/headless.mjs 1337 3 3000 | grep -o 'checksum=[0-9]*')
          if [ "$C" != "checksum=985466095" ]; then
            echo "checksum $C differs from recorded baseline checksum=985466095"
            exit 1
          fi
          echo "baseline matches"

      - name: Upload bundle and revision evidence
        if: matrix.node == '24.x'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homefront-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/homefront.html
          if-no-files-found: error
          retention-days: 14
